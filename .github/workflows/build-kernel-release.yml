name: Build and Release VERMEER Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      test_release:
        description: 'Trigger a test release (skips build, uses dummy values)?'
        required: true
        type: boolean
        default: false
      kernelsu_variant:
        description: "Choose KernelSU (must be 'Next')"
        required: true
        type: string
        default: "Next"
      kernelsu_branch:
        description: "Choose ksu branch (must be 'Stable', 'Dev', or 'Other')"
        required: true
        type: string
        default: "Dev"
      kernelsu_branch_other:
        description: "If 'Other' is selected, specify your custom branch"
        required: false
        type: string
        default: ""
      kernelsu_commit_hash:
        description: "Specify the GitHub commit hash for KernelSU Next (e.g., 3fd61e0ee5ee5e6fe941a892924ac26aa752b618). Leave blank for latest."
        required: false
        type: string
      susfs_version:
        description: "Specify the SUSFS version"
        required: true
        type: string
        default: "v1.5.9"

env:
  BASE_VERSION: "1.5.9"  # For tag generation
  BASE_KERNELSU_VERSION: "1.0.9"  # For KernelSU version

jobs:
  build-kernel-a13-5-15:
    runs-on: ubuntu-latest
    if: ${{ !inputs.test_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev  # Change to 'main' if your primary branch is main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Installing dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu clang make bc ccache curl git

      - name: Set CONFIG Environment Variable
        run: |
          CONFIG="android13-5.15-123"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV
          echo "CONFIG set to: $CONFIG"

      - name: Clone AnyKernel3 and Other Dependencies
        run: |
          echo "Cloning AnyKernel3 and other dependencies..."
          ANYKERNEL_BRANCH="riri"
          SUSFS_BRANCH="gki-android13-5.15"
          echo "Using branch for AnyKernel3: $ANYKERNEL_BRANCH"
          echo "Using branch for SUSFS: $SUSFS_BRANCH"
          git clone https://github.com/RiRiRawrZ615/AnyKernel3.git -b "$ANYKERNEL_BRANCH" --depth=1
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH" --depth=1
          git clone https://github.com/RiRiRawrZ615/kernel_patches.git --depth=1
          git clone https://github.com/RiRiRawrZ615/android_kernel_google_gs101.git -b android-gs-bluraviole-5.10-android14-qpr2-monolithic "$CONFIG"

      - name: Verify checkout
        run: |
          echo "Listing working directory contents:"
          ls -la
          if [ ! -d "$CONFIG/arch" ] || [ ! -f "$CONFIG/Makefile" ] || [ ! -f "$CONFIG/arch/arm64/configs/gs101_defconfig" ] || [ ! -d "$CONFIG/drivers" ]; then
            echo "Error: Kernel source files not found in $CONFIG. Expected Makefile, arch/arm64/configs/gs101_defconfig, and drivers/." >&2
            exit 1
          fi
          echo "Kernel source files verified in $CONFIG"

      - name: Add KernelSU
        run: |
          echo "Changing to configuration directory: $CONFIG..."
          cd "$CONFIG"
          echo "Running KernelSU setup in $(pwd)"
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next || {
            echo "Error: KernelSU setup failed. Dumping directory contents for debugging:"
            ls -la
            exit 1
          }
          cd KernelSU-Next
          echo "Using specified KernelSU commit: ${{ inputs.kernelsu_commit_hash }}"
          git checkout ${{ inputs.kernelsu_commit_hash }}
          cd ..
          echo "Post-KernelSU setup directory contents:"
          ls -la

      - name: Apply SUSFS Patches
        run: |
          cd "$CONFIG"
          echo "Applying SUSFS patches..."
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch ./
          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch || true
          cd KernelSU-Next
          cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./
          patch -p1 --forward --fuzz=3 < 10_enable_susfs_for_ksu.patch || true
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_apk_sign.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_apk_sign.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_core_hook.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_core_hook.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_selinux.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_selinux.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_ksud.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_ksud.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_rules.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_rules.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_sucompat.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_sucompat.c.patch
          cp ../../kernel_patches/next/susfs_fix_patches/${{ inputs.susfs_version }}/fix_kernel_compat.c.patch ./
          patch -p1 --forward --fuzz=3 < fix_kernel_compat.c.patch
          cd ..

      - name: Apply KSU Hooks
        run: |
          cd "$CONFIG"
          cp ../kernel_patches/next/next_hooks.patch ./
          patch -p1 --fuzz=3 < next_hooks.patch

      - name: Apply Hide Stuff Patches
        run: |
          cd "$CONFIG"
          cp ../kernel_patches/69_hide_stuff.patch ./
          patch -p1 -F 3 < 69_hide_stuff.patch

      - name: Apply KernelSU & SUSFS SUltan Fixes
        run: |
          cd "$CONFIG"
          sed -i "s/poofed_size: '%u'/poofed_size: '%llu'/g" ./fs/susfs.c
          sed -i "s/length of string: %u/length of string: %lu/g" ./fs/susfs.c

      - name: Add SUSFS Configuration Settings
        run: |
          cd "$CONFIG"
          echo "CONFIG_KSU=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_KPROBES_HOOK=n" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_KSTAT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_ENABLE_LOG=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> ./arch/arm64/configs/gs101_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_SU=n" >> ./arch/arm64/configs/gs101_defconfig

      - name: Download and Extract Toolchain
        run: |
          TOOLCHAIN_TAR="x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz"
          TOOLCHAIN_DIR="gcc-14.2.0-nolibc/aarch64-linux"
          wget https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/$TOOLCHAIN_TAR
          tar -xzf $TOOLCHAIN_TAR
          TOOLCHAIN_PATH="$PWD/$TOOLCHAIN_DIR"
          if [ ! -d "$TOOLCHAIN_PATH" ]; then
            echo "Error: Toolchain directory not found!"
            exit 1
          fi
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_PATH" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN_PATH/bin/aarch64-linux-gcc" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$TOOLCHAIN_PATH/bin/aarch64-linux-" >> $GITHUB_ENV
          echo "PATH=$TOOLCHAIN_PATH/bin:$PATH" >> $GITHUB_ENV

      - name: Verify Toolchain
        run: |
          $CC --version

      - name: Build kernel
        run: |
          cd "$CONFIG"
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-
          export CC=aarch64-linux-gcc
          make gs101_defconfig -j$(nproc --all)
          make -j$(nproc --all)

      - name: Check for .rej files
        if: failure()
        run: |
          echo "::group::Checking for .rej files..."
          REJ_FILES=$(find "$CONFIG" -name '*.rej')
          if [ -z "$REJ_FILES" ]; then
            echo "No .rej files found."
          else
            echo "Found .rej files:"
            echo "$REJ_FILES"
            for f in $REJ_FILES; do
              echo "--- $f ---"
              cat "$f"
            done
          fi
          echo "::endgroup::"

      - name: Upload .rej files as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects
          path: "${{ env.CONFIG }}/**/*.rej"
          if-no-files-found: warn

      - name: Debug Build Output
        if: ${{ always() }}
        run: |
          echo "Listing kernel source directory ($CONFIG):"
          ls -R "$CONFIG"
          echo "Listing external repos directories:"
          ls -R AnyKernel3 susfs4ksu kernel_patches
          if [ -d "$CONFIG/out" ]; then
            echo "Listing out directory:"
            ls -R "$CONFIG/out"
          else
            echo "No out/ directory found in $CONFIG"
          fi

      - name: Copy Images
        run: |
          cd "$CONFIG"
          echo "Copying Image.lz4 and dtbo.img..."
          cp ./out/arch/arm64/boot/Image.lz4 ../AnyKernel3/Image.lz4
          cp ./out/arch/arm64/boot/dts/google/dtbo.img ../AnyKernel3/dtbo.img

      - name: Create AnyKernel3 zip
        run: |
          cd AnyKernel3
          zip -r ../gs101.zip *

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a13-5-15
          path: gs101.zip

  trigger-release:
    runs-on: ubuntu-latest
    needs: build-kernel-a13-5-15  # Only depend on build job for real builds
    if: ${{ inputs.make_release && !inputs.test_release }}
    env:
      REPO_OWNER: RiRiRawrZ615
      REPO_NAME: Vermeer_GKI_KernelSU_SUSFS
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev  # Change to 'main' if your primary branch is main

      - name: Validate inputs and determine branch
        run: |
          if [ "${{ inputs.kernelsu_variant }}" != "Next" ]; then
            echo "Error: kernelsu_variant must be 'Next'" >&2
            exit 1
          fi

          VALID_BRANCHES=("Stable" "Dev" "Other")
          if [[ ! " ${VALID_BRANCHES[@]} " =~ " ${{ inputs.kernelsu_branch }} " ]]; then
            echo "Error: kernelsu_branch must be 'Stable', 'Dev', or 'Other'" >&2
            exit 1
          fi

          if [[ "${{ inputs.kernelsu_branch }}" == "Dev" ]]; then
            BRANCH="next"
          elif [[ "${{ inputs.kernelsu_branch }}" == "Other" && -n "${{ inputs.kernelsu_branch_other }}" ]]; then
            BRANCH="${{ inputs.kernelsu_branch_other }}"
          else
            echo "Error: Custom branch not provided for 'Other'" >&2
            exit 1
          fi

          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Get KernelSU commit info
        run: |
          REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"
          REPO_URL2="KernelSU-Next/KernelSU-Next"
          
          if [ -z "${{ inputs.kernelsu_commit_hash }}" ]; then
            KSU_REF=$(git ls-remote --heads $REPO_URL refs/heads/next | awk '{print $1}')
          else
            KSU_REF=${{ inputs.kernelsu_commit_hash }}
          fi
          KSU_URL="https://github.com/$REPO_URL2/commit/$KSU_REF"

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      - name: Detect KernelSU version
        run: |
          if [ "${{ inputs.test_release }}" == "true" ]; then
            echo "Using dummy values for test release..."
            echo "KSU_MAIN_VERSION=${{ env.BASE_KERNELSU_VERSION }}" >> $GITHUB_ENV
            echo "KSU_SUB_VERSION=12798" >> $GITHUB_ENV
          else
            KSU_VERSION=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | jq -r '.[0].name' | grep -oP 'v\d+\.\d+\.\d+')
            [ -z "$KSU_VERSION" ] && KSU_VERSION="v${{ env.BASE_KERNELSU_VERSION }}"
            
            KSU_MAIN_VERSION=$(echo "$KSU_VERSION" | sed 's/v//' | cut -d'.' -f1-2)
            KSU_SUB_VERSION=$(echo "$KSU_VERSION" | grep -oP '\d+$' || echo "0")
            
            echo "KSU_MAIN_VERSION=$KSU_MAIN_VERSION" >> $GITHUB_ENV
            echo "KSU_SUB_VERSION=$KSU_SUB_VERSION" >> $GITHUB_ENV
          fi

      - name: Get SUSFS commit info
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/gki-android13-5.15 | awk '{ print $1 }')
          COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
          echo "COMMIT_HASH=$COMMIT_HASH" >> "$GITHUB_ENV"
          echo "COMMIT_URL=$COMMIT_URL" >> "$GITHUB_ENV"

      - name: Detect SUSFS Version
        run: |
          if [ "${{ inputs.test_release }}" == "true" ]; then
            echo "Using dummy SUSFS version for test release..."
            echo "SUSFS_VERSION=v1.5.9" >> $GITHUB_ENV
          else
            SUSFS_VERSION=${{ inputs.susfs_version }}
            echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV
          fi

      - name: Construct Release Information
        run: |
          RELEASE_NAME="VERMEER BUILD GKI Kernels With KernelSU-${KSU_MAIN_VERSION}.${KSU_SUB_VERSION} & SUSFS ${SUSFS_VERSION} VERMEER BUILD"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "This release contains **KernelSU-${KSU_MAIN_VERSION}.${KSU_SUB_VERSION}** (${{ inputs.kernelsu_branch }}) and **SUSFS ${SUSFS_VERSION}**" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Features:**" >> $GITHUB_ENV
          echo "- KernelSU-${{ inputs.kernelsu_variant }}-${{ inputs.kernelsu_branch }} ${KSU_MAIN_VERSION}.${KSU_SUB_VERSION}" >> $GITHUB_ENV
          echo "- SUSFS ${SUSFS_VERSION}" >> $GITHUB_ENV
          echo "- Manual Hooks" >> $GITHUB_ENV
          echo "- Wireguard Support" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Notes:**" >> $GITHUB_ENV
          echo "This is a MODIFIED kernel only meant for VERMEER devices a.k.a Redmi K70 / Poco F6 Pro, running on HyperOS 1.0.6. If you do not have this device please do not flash this." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Module:**" >> $GITHUB_ENV
          echo "- https://github.com/sidex15/ksu_module_susfs" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Commit Hashes:**" >> $GITHUB_ENV
          echo "- KernelSU: [$KSU_REF]($KSU_URL)" >> $GITHUB_ENV
          echo "- SUSFS4KSU: [$COMMIT_HASH]($COMMIT_URL)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "LTO: thin" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate and Create New Tag
        run: |
          # Fetch all existing tags matching our pattern
          TAGS=$(git tag -l "v${BASE_VERSION}-r*" | sort -V)
          
          if [ -z "$TAGS" ]; then
            NEW_TAG="v${BASE_VERSION}-r1"
          else
            LAST_TAG=$(echo "$TAGS" | tail -n1)
            LAST_NUM=$(echo "$LAST_TAG" | sed -E "s/v${BASE_VERSION//./\\.}-r([0-9]+)/\1/")
            NEW_NUM=$((LAST_NUM + 1))
            NEW_TAG="v${BASE_VERSION}-r${NEW_NUM}"
          fi
          
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          
          git tag $NEW_TAG || echo "Tag already exists, continuing..."
          git push origin $NEW_TAG || echo "Tag push failed, may already exist"

      - name: Download Artifacts
        if: ${{ inputs.test_release != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: kernel-a13-5-15
          path: ./downloaded-artifacts

      - name: Prepare Artifacts
        run: |
          mkdir -p ./release-artifacts
          KSU_VERSION="${{ env.KSU_MAIN_VERSION }}"
          KSU_SUB_VERSION="${{ env.KSU_SUB_VERSION }}"
          SUSFS_VERSION="${{ env.SUSFS_VERSION }}"
          NEW_BASE_NAME="android13-5.15.123-AK3-KSU-Next-${KSU_VERSION}-Dev-${KSU_SUB_VERSION}-SUSFS${SUSFS_VERSION}"
          
          if [ "${{ inputs.test_release }}" == "true" ]; then
            echo "Creating dummy files for test release..."
            echo "Test content" > "./release-artifacts/${NEW_BASE_NAME}.zip"
            echo "Test content" > "./release-artifacts/${NEW_BASE_NAME}.img"
          else
            echo "Preparing real artifacts..."
            mv ./downloaded-artifacts/gs101.zip "./release-artifacts/${NEW_BASE_NAME}.zip"
            mv ./downloaded-artifacts/Image.lz4 "./release-artifacts/${NEW_BASE_NAME}.img"
          fi

      - name: Verify Artifacts
        run: |
          if [ ! -f "./release-artifacts/"*.zip ] || [ ! -f "./release-artifacts/"*.img ]; then
            echo "Error: Required artifacts missing!"
            exit 1
          fi
          echo "Artifacts verified:"
          ls -lh ./release-artifacts/

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: true
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets
        run: |
          for file in ./release-artifacts/*; do
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
          done

  test-release:
    runs-on: ubuntu-latest
    if: ${{ inputs.make_release && inputs.test_release }}
    env:
      REPO_OWNER: RiRiRawrZ615
      REPO_NAME: Vermeer_GKI_KernelSU_SUSFS
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev  # Change to 'main' if your primary branch is main

      - name: Validate inputs and determine branch
        run: |
          if [ "${{ inputs.kernelsu_variant }}" != "Next" ]; then
            echo "Error: kernelsu_variant must be 'Next'" >&2
            exit 1
          fi

          VALID_BRANCHES=("Stable" "Dev" "Other")
          if [[ ! " ${VALID_BRANCHES[@]} " =~ " ${{ inputs.kernelsu_branch }} " ]]; then
            echo "Error: kernelsu_branch must be 'Stable', 'Dev', or 'Other'" >&2
            exit 1
          fi

          if [[ "${{ inputs.kernelsu_branch }}" == "Dev" ]]; then
            BRANCH="next"
          elif [[ "${{ inputs.kernelsu_branch }}" == "Other" && -n "${{ inputs.kernelsu_branch_other }}" ]]; then
            BRANCH="${{ inputs.kernelsu_branch_other }}"
          else
            echo "Error: Custom branch not provided for 'Other'" >&2
            exit 1
          fi

          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Get KernelSU commit info
        run: |
          REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"
          REPO_URL2="KernelSU-Next/KernelSU-Next"
          
          if [ -z "${{ inputs.kernelsu_commit_hash }}" ]; then
            KSU_REF=$(git ls-remote --heads $REPO_URL refs/heads/next | awk '{print $1}')
          else
            KSU_REF=${{ inputs.kernelsu_commit_hash }}
          fi
          KSU_URL="https://github.com/$REPO_URL2/commit/$KSU_REF"

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      - name: Detect KernelSU version
        run: |
          echo "Using dummy values for test release..."
          echo "KSU_MAIN_VERSION=${{ env.BASE_KERNELSU_VERSION }}" >> $GITHUB_ENV
          echo "KSU_SUB_VERSION=12798" >> $GITHUB_ENV

      - name: Get SUSFS commit info
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/gki-android13-5.15 | awk '{ print $1 }')
          COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
          
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_URL=$COMMIT_URL" >> $GITHUB

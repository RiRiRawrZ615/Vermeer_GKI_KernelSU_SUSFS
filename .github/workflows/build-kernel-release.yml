name: Build and Release VERMEER Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      test_release:
        description: 'Trigger a test release (skips build, uses dummy values)?'
        required: true
        type: boolean
        default: false
      kernelsu_variant:
        description: "Choose KernelSU (must be 'Next')"
        required: true
        type: string
        default: "Next"
      kernelsu_branch:
        description: "Choose ksu branch (must be 'Stable', 'Dev', or 'Other')"
        required: true
        type: string
        default: "Dev"
      kernelsu_branch_other:
        description: "If 'Other' is selected, specify your custom branch"
        required: false
        type: string
        default: ""
      kernelsu_commit_hash:
        description: "Specify the GitHub commit hash for KernelSU Next (e.g., 3fd61e0ee5ee5e6fe941a892924ac26aa752b618). Leave blank for latest."
        required: false
        type: string
      susfs_version:
        description: "Specify the SUSFS version"
        required: true
        type: string
        default: "v1.5.9"

env:
  BASE_VERSION: "1.5.9"  # For tag generation
  BASE_KERNELSU_VERSION: "1.0.9"  # For KernelSU version

jobs:
  build-kernel-a13-5-15:
    runs-on: ubuntu-latest
    if: ${{ !inputs.test_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev  # Change to 'main' if your primary branch is main

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Installing dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu clang make bc ccache

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          cd KernelSU-Next
          if [ -z "${{ inputs.kernelsu_commit_hash }}" ]; then
            git checkout $(git rev-parse origin/next)
          else
            git checkout ${{ inputs.kernelsu_commit_hash }}
          fi
          cd ..

      - name: Build Kernel
        run: |
          make -j$(nproc --all)

      - name: Package Artifacts
        run: |
          mkdir -p ./artifacts
          cp out/arch/arm64/boot/Image.lz4 ./artifacts/Image.lz4
          cp AnyKernel3/gs101.zip ./artifacts/gs101.zip
          # Explicitly don't copy dtbo.img

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a13-5-15
          path: ./artifacts/

  trigger-release:
    runs-on: ubuntu-latest
    needs: build-kernel-a13-5-15  # Ensure this job runs after build-kernel-a13-5-15
    if: ${{ inputs.make_release }}
    env:
      REPO_OWNER: RiRiRawrZ615
      REPO_NAME: Vermeer_GKI_KernelSU_SUSFS
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev  # Change to 'main' if your primary branch is main

      - name: Validate inputs and determine branch
        run: |
          if [ "${{ inputs.kernelsu_variant }}" != "Next" ]; then
            echo "Error: kernelsu_variant must be 'Next'" >&2
            exit 1
          fi

          VALID_BRANCHES=("Stable" "Dev" "Other")
          if [[ ! " ${VALID_BRANCHES[@]} " =~ " ${{ inputs.kernelsu_branch }} " ]]; then
            echo "Error: kernelsu_branch must be 'Stable', 'Dev', or 'Other'" >&2
            exit 1
          fi

          if [[ "${{ inputs.kernelsu_branch }}" == "Dev" ]]; then
            BRANCH="next"
          elif [[ "${{ inputs.kernelsu_branch }}" == "Other" && -n "${{ inputs.kernelsu_branch_other }}" ]]; then
            BRANCH="${{ inputs.kernelsu_branch_other }}"
          else
            echo "Error: Custom branch not provided for 'Other'" >&2
            exit 1
          fi

          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Get KernelSU commit info
        run: |
          REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"
          REPO_URL2="KernelSU-Next/KernelSU-Next"
          
          if [ -z "${{ inputs.kernelsu_commit_hash }}" ]; then
            KSU_REF=$(git ls-remote --heads $REPO_URL refs/heads/next | awk '{print $1}')
          else
            KSU_REF=${{ inputs.kernelsu_commit_hash }}
          fi
          KSU_URL="https://github.com/$REPO_URL2/commit/$KSU_REF"

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      - name: Detect KernelSU version
        run: |
          if [ "${{ inputs.test_release }}" == "true" ]; then
            echo "Using dummy values for test release..."
            echo "KSU_MAIN_VERSION=${{ env.BASE_KERNELSU_VERSION }}" >> $GITHUB_ENV
            echo "KSU_SUB_VERSION=12798" >> $GITHUB_ENV
          else
            KSU_VERSION=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | jq -r '.[0].name' | grep -oP 'v\d+\.\d+\.\d+')
            [ -z "$KSU_VERSION" ] && KSU_VERSION="v${{ env.BASE_KERNELSU_VERSION }}"
            
            KSU_MAIN_VERSION=$(echo "$KSU_VERSION" | sed 's/v//' | cut -d'.' -f1-2)
            KSU_SUB_VERSION=$(echo "$KSU_VERSION" | grep -oP '\d+$' || echo "0")
            
            echo "KSU_MAIN_VERSION=$KSU_MAIN_VERSION" >> $GITHUB_ENV
            echo "KSU_SUB_VERSION=$KSU_SUB_VERSION" >> $GITHUB_ENV
          fi

      - name: Get SUSFS commit info
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/gki-android13-5.15 | awk '{ print $1 }')
          COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
          
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_URL=$COMMIT_URL" >> $GITHUB_ENV

      - name: Detect SUSFS Version
        run: |
          if [ "${{ inputs.test_release }}" == "true" ]; then
            echo "Using dummy SUSFS version for test release..."
            echo "SUSFS_VERSION=v1.5.9" >> $GITHUB_ENV
          else
            SUSFS_VERSION=${{ inputs.susfs_version }}
            echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV
          fi

      - name: Construct Release Information
        run: |
          RELEASE_NAME="VERMEER BUILD GKI Kernels With KernelSU-${KSU_MAIN_VERSION}.${KSU_SUB_VERSION} & SUSFS ${SUSFS_VERSION} VERMEER BUILD"
          echo "RELEASE_NAME=${RELEASE_NAME}" >> $GITHUB_ENV
          
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "This release contains **KernelSU-${KSU_MAIN_VERSION}.${KSU_SUB_VERSION}** (${{ inputs.kernelsu_branch }}) and **SUSFS ${SUSFS_VERSION}**" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Features:**" >> $GITHUB_ENV
          echo "- KernelSU-${{ inputs.kernelsu_variant }}-${{ inputs.kernelsu_branch }} ${KSU_MAIN_VERSION}.${KSU_SUB_VERSION}" >> $GITHUB_ENV
          echo "- SUSFS ${SUSFS_VERSION}" >> $GITHUB_ENV
          echo "- Manual Hooks" >> $GITHUB_ENV
          echo "- Wireguard Support" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Notes:**" >> $GITHUB_ENV
          echo "This is a MODIFIED kernel only meant for VERMEER devices a.k.a Redmi K70 / Poco F6 Pro, running on HyperOS 1.0.6. If you do not have this device please do not flash this." >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Module:**" >> $GITHUB_ENV
          echo "- https://github.com/sidex15/ksu_module_susfs" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "**Commit Hashes:**" >> $GITHUB_ENV
          echo "- KernelSU: [$KSU_REF]($KSU_URL)" >> $GITHUB_ENV
          echo "- SUSFS4KSU: [$COMMIT_HASH]($COMMIT_URL)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "LTO: thin" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate and Create New Tag
        run: |
          # Fetch all existing tags matching our pattern
          TAGS=$(git tag -l "v${BASE_VERSION}-r*" | sort -V)
          
          if [ -z "$TAGS" ]; then
            NEW_TAG="v${BASE_VERSION}-r1"
          else
            LAST_TAG=$(echo "$TAGS" | tail -n1)
            LAST_NUM=$(echo "$LAST_TAG" | sed -E "s/v${BASE_VERSION//./\\.}-r([0-9]+)/\1/")
            NEW_NUM=$((LAST_NUM + 1))
            NEW_TAG="v${BASE_VERSION}-r${NEW_NUM}"
          fi
          
          echo "New tag: $NEW_TAG"
          echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
          
          git tag $NEW_TAG || echo "Tag already exists, continuing..."
          git push origin $NEW_TAG || echo "Tag push failed, may already exist"

      - name: Download Artifacts
        if: ${{ inputs.test_release != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: kernel-a13-5-15
          path: ./downloaded-artifacts

      - name: Prepare Artifacts
        run: |
          mkdir -p ./release-artifacts
          KSU_VERSION="${{ env.KSU_MAIN_VERSION }}"
          KSU_SUB_VERSION="${{ env.KSU_SUB_VERSION }}"
          SUSFS_VERSION="${{ env.SUSFS_VERSION }}"
          NEW_BASE_NAME="android13-5.15.123-AK3-KSU-Next-${KSU_VERSION}-Dev-${KSU_SUB_VERSION}-SUSFS${SUSFS_VERSION}"
          
          if [ "${{ inputs.test_release }}" == "true" ]; then
            echo "Creating dummy files for test release..."
            echo "Test content" > "./release-artifacts/${NEW_BASE_NAME}.zip"
            echo "Test content" > "./release-artifacts/${NEW_BASE_NAME}.img"
          else
            echo "Preparing real artifacts..."
            mv ./downloaded-artifacts/gs101.zip "./release-artifacts/${NEW_BASE_NAME}.zip"
            mv ./downloaded-artifacts/Image.lz4 "./release-artifacts/${NEW_BASE_NAME}.img"
          fi

      - name: Verify Artifacts
        run: |
          if [ ! -f "./release-artifacts/"*.zip ] || [ ! -f "./release-artifacts/"*.img ]; then
            echo "Error: Required artifacts missing!"
            exit 1
          fi
          echo "Artifacts verified:"
          ls -lh ./release-artifacts/

      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          prerelease: true
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}

      - name: Upload Release Assets
        run: |
          for file in ./release-artifacts/*; do
              echo "Uploading $file..."
              gh release upload ${{ env.NEW_TAG }} "$file"
          done

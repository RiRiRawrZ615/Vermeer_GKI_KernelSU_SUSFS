name: Build and Release VERMEER Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 'Do you want to create a release?'
        required: true
        type: boolean
        default: true
      test_release:
        description: 'Trigger a test release (skips build, uses dummy values)?'
        required: true
        type: boolean
        default: false
      kernelsu_variant:
        description: "Choose KernelSU (must be 'Next')"
        required: true
        type: string
        default: "Next"
      kernelsu_branch:
        description: "Choose ksu branch (must be 'Stable', 'Dev', or 'Other')"
        required: true
        type: string
        default: "Dev"
      kernelsu_branch_other:
        description: "If 'Other' is selected, specify your custom branch"
        required: false
        type: string
        default: ""
      kernelsu_commit_hash:
        description: "Specify the GitHub commit hash for KernelSU Next (e.g., 3fd61e0ee5ee5e6fe941a892924ac26aa752b618). Leave blank for latest."
        required: false
        type: string
      susfs_version:
        description: "Specify the SUSFS version"
        required: true
        type: string
        default: "v1.5.9"

env:
  BASE_VERSION: "1.5.9"
  BASE_KERNELSU_VERSION: "1.0.9"

jobs:
  build-kernel-a13-5-15:
    runs-on: ubuntu-latest
    if: ${{ !inputs.test_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y gcc-aarch64-linux-gnu clang make bc ccache curl git

      - name: Set CONFIG environment variable
        run: |
          CONFIG="android13-5.15-123"
          echo "CONFIG=$CONFIG" >> $GITHUB_ENV

      - name: Clone dependencies
        run: |
          git clone https://github.com/RiRiRawrZ615/AnyKernel3.git -b riri --depth=1
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15 --depth=1
          git clone https://github.com/RiRiRawrZ615/kernel_patches.git --depth=1
          git clone https://github.com/RiRiRawrZ615/android_kernel_google_gs101.git -b android-gs-bluraviole-5.10-android14-qpr2-monolithic $CONFIG

      - name: Verify checkout
        run: |
          if [ ! -d "$CONFIG/arch" ] || [ ! -f "$CONFIG/Makefile" ] || [ ! -f "$CONFIG/arch/arm64/configs/gs101_defconfig" ] || [ ! -d "$CONFIG/drivers" ]; then
            echo "Error: Kernel source files not found in $CONFIG" >&2
            exit 1
          fi

      - name: Add KernelSU
        run: |
          cd $CONFIG
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
          cd KernelSU-Next
          git checkout ${{ inputs.kernelsu_commit_hash }} || git checkout next
          cd ..

      - name: Apply SUSFS patches
        run: |
          cd $CONFIG
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch .
          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch
          cd KernelSU-Next
          cp ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch .
          patch -p1 < 10_enable_susfs_for_ksu.patch
          cd ../..

      - name: Apply additional patches
        run: |
          cd $CONFIG
          cp ../kernel_patches/next/next_hooks.patch .
          patch -p1 < next_hooks.patch
          cp ../kernel_patches/69_hide_stuff.patch .
          patch -p1 < 69_hide_stuff.patch
          sed -i "s/poofed_size: '%u'/poofed_size: '%llu'/g" ./fs/susfs.c
          sed -i "s/length of string: %u/length of string: %lu/g" ./fs/susfs.c

      - name: Add SUSFS configuration
        run: |
          cd $CONFIG
          cat >> ./arch/arm64/configs/gs101_defconfig << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_KPROBES_HOOK=n
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=n
          EOF

      - name: Download and setup toolchain
        run: |
          wget https://mirrors.edge.kernel.org/pub/tools/crosstool/files/bin/x86_64/14.2.0/x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          tar -xzf x86_64-gcc-14.2.0-nolibc-aarch64-linux.tar.gz
          TOOLCHAIN_PATH="$PWD/gcc-14.2.0-nolibc/aarch64-linux"
          echo "TOOLCHAIN_PATH=$TOOLCHAIN_PATH" >> $GITHUB_ENV
          echo "CC=$TOOLCHAIN_PATH/bin/aarch64-linux-gcc" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$TOOLCHAIN_PATH/bin/aarch64-linux-" >> $GITHUB_ENV
          echo "PATH=$TOOLCHAIN_PATH/bin:$PATH" >> $GITHUB_ENV

      - name: Build kernel
        run: |
          cd $CONFIG
          export ARCH=arm64
          export SUBARCH=arm64
          make gs101_defconfig
          make -j$(nproc)

      - name: Package artifacts
        run: |
          cd $CONFIG
          cp out/arch/arm64/boot/Image.lz4 ../AnyKernel3/
          cp out/arch/arm64/boot/dts/google/dtbo.img ../AnyKernel3/
          cd ../AnyKernel3
          zip -r ../gs101.zip *

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-a13-5-15
          path: gs101.zip

  trigger-release:
    runs-on: ubuntu-latest
    needs: build-kernel-a13-5-15
    if: ${{ inputs.make_release && !inputs.test_release }}
    permissions:
      contents: write
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Validate inputs
        run: |
          if [ "${{ inputs.kernelsu_variant }}" != "Next" ]; then
            exit 1
          fi
          if [[ ! " Stable Dev Other " =~ " ${{ inputs.kernelsu_branch }} " ]]; then
            exit 1
          fi
          if [ "${{ inputs.kernelsu_branch }}" == "Other" ] && [ -z "${{ inputs.kernelsu_branch_other }}" ]; then
            exit 1
          fi
          BRANCH=${{ inputs.kernelsu_branch_other || (inputs.kernelsu_branch == 'Dev' && 'next') || inputs.kernelsu_branch }}
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Get KernelSU info
        run: |
          REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"
          KSU_REF=${{ inputs.kernelsu_commit_hash || $(git ls-remote --heads $REPO_URL refs/heads/next | awk '{print $1}') }}
          KSU_URL="https://github.com/KernelSU-Next/KernelSU-Next/commit/$KSU_REF"
          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV
          KSU_VERSION=$(curl -s "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/tags" | jq -r '.[0].name' | grep -oP 'v\d+\.\d+\.\d+' || echo "v${BASE_KERNELSU_VERSION}")
          KSU_MAIN_VERSION=$(echo "$KSU_VERSION" | sed 's/v//' | cut -d'.' -f1-2)
          KSU_SUB_VERSION=$(echo "$KSU_VERSION" | grep -oP '\d+$' || echo "0")
          echo "KSU_MAIN_VERSION=$KSU_MAIN_VERSION" >> $GITHUB_ENV
          echo "KSU_SUB_VERSION=$KSU_SUB_VERSION" >> $GITHUB_ENV

      - name: Get SUSFS info
        run: |
          COMMIT_HASH=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android13-5.15 | awk '{print $1}')
          COMMIT_URL="https://gitlab.com/simonpunk/susfs4ksu/-/commit/$COMMIT_HASH"
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_URL=$COMMIT_URL" >> $GITHUB_ENV
          SUSFS_VERSION=${{ inputs.susfs_version }}
          echo "SUSFS_VERSION=$SUSFS_VERSION" >> $GITHUB_ENV

      - name: Construct release info
        run: |
          RELEASE_NAME="VERMEER BUILD GKI Kernels With KernelSU-${KSU_MAIN_VERSION}.${KSU_SUB_VERSION} & SUSFS ${SUSFS_VERSION} VERMEER BUILD"
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "This release contains **KernelSU-${KSU_MAIN_VERSION}.${KSU_SUB_VERSION}** (${{ inputs.kernelsu_branch }}) and **SUSFS ${SUSFS_VERSION}**" >> $GITHUB_ENV
          echo "**Features:**" >> $GITHUB_ENV
          echo "- KernelSU-${{ inputs.kernelsu_variant }}-${{ inputs.kernelsu_branch }} ${KSU_MAIN_VERSION}.${KSU_SUB_VERSION}" >> $GITHUB_ENV
          echo "- SUSFS ${SUSFS_VERSION}" >> $GITHUB_ENV
          echo "- Manual Hooks" >> $GITHUB_ENV
          echo "- Wireguard Support" >> $GITHUB_ENV
          echo "**Notes:**" >> $GITHUB_ENV
          echo "This is a MODIFIED kernel only meant for VERMEER devices a.k.a Redmi K70 / Poco F6 Pro, running on HyperOS 1.0.6. If you do not have this device please do not flash this." >> $GITHUB_ENV
          echo "**Commit Hashes:**" >> $GITHUB_ENV
          echo "- KernelSU: [$KSU_REF]($KSU_URL)" >> $GITHUB_ENV
          echo "- SUSFS4KSU: [$COMMIT_HASH]($COMMIT_URL)" >> $GITHUB_ENV
          echo "LTO: thin" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate and create tag
        run: |
          TAGS=$(git tag -l "v${BASE_VERSION}-r*" | sort -V)
          if [ -z "$TAGS" ]; then
            NEW_TAG="v${BASE_VERSION}-r1"
          else
            LAST_TAG=$(echo "$TAGS" | tail -n1)
            LAST_NUM=$(echo "$LAST_TAG" | sed -E "s/v${BASE_VERSION//./\\.}-r([0-9]+)/\1/")
            NEW_NUM=$((LAST_NUM + 1))
            NEW_TAG="v${BASE_VERSION}-r${NEW_NUM}"
          fi
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            NEW_TAG="${NEW_TAG}-$(date +%s)"
          done
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: kernel-a13-5-15
          path: ./artifacts

      - name: Prepare release assets
        run: |
          KSU_VERSION="${{ env.KSU_MAIN_VERSION }}"
          KSU_SUB_VERSION="${{ env.KSU_SUB_VERSION }}"
          SUSFS_VERSION="${{ env.SUSFS_VERSION }}"
          NEW_BASE_NAME="android13-5.15.123-AK3-KSU-Next-${KSU_VERSION}-Dev-${KSU_SUB_VERSION}-SUSFS${SUSFS_VERSION}"
          mv ./artifacts/gs101.zip "./${NEW_BASE_NAME}.zip"

      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          prerelease: true

      - name: Upload release assets
        run: gh release upload ${{ env.NEW_TAG }} "${NEW_BASE_NAME}.zip"

  test-release:
    runs-on: ubuntu-latest
    if: ${{ inputs.make_release && inputs.test_release }}
    permissions:
      contents: write
      actions: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Validate inputs
        run: |
          if [ "${{ inputs.kernelsu_variant }}" != "Next" ]; then
            exit 1
          fi
          if [[ ! " Stable Dev Other " =~ " ${{ inputs.kernelsu_branch }} " ]]; then
            exit 1
          fi
          if [ "${{ inputs.kernelsu_branch }}" == "Other" ] && [ -z "${{ inputs.kernelsu_branch_other }}" ]; then
            exit 1
          fi
          BRANCH=${{ inputs.kernelsu_branch_other || (inputs.kernelsu_branch == 'Dev' && 'next') || inputs.kernelsu_branch }}
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Get KernelSU info
        run: |
          REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"
          KSU_REF=${{ inputs.kernelsu_commit_hash || $(git ls-remote --heads $REPO_URL refs/heads/next | awk '{print $1}') }}
          KSU_URL="https://github.com/KernelSU-Next/KernelSU-Next/commit/$KSU_REF"
          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV
          echo "KSU_MAIN_VERSION=${BASE_KERNELSU_VERSION}" >> $GITHUB_ENV
          echo "KSU_SUB_VERSION=12798" >> $GITHUB_ENV

      - name: Get SUSFS info
        run: |
          COMMIT_HASH=$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/gki-android13-5.15 | awk '{print $1}')
          COMMIT_URL="https://gitlab.com/simonpunk/susfs4ksu/-/commit/$COMMIT_HASH"
          echo "COMMIT_HASH=$COMMIT_HASH" >> $GITHUB_ENV
          echo "COMMIT_URL=$COMMIT_URL" >> $GITHUB_ENV
          echo "SUSFS_VERSION=v1.5.9" >> $GITHUB_ENV

      - name: Construct release info
        run: |
          RELEASE_NAME="VERMEER BUILD GKI Kernels With KernelSU-${KSU_MAIN_VERSION}.${KSU_SUB_VERSION} & SUSFS ${SUSFS_VERSION} VERMEER BUILD"
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "This release contains **KernelSU-${KSU_MAIN_VERSION}.${KSU_SUB_VERSION}** (${{ inputs.kernelsu_branch }}) and **SUSFS ${SUSFS_VERSION}**" >> $GITHUB_ENV
          echo "**Features:**" >> $GITHUB_ENV
          echo "- KernelSU-${{ inputs.kernelsu_variant }}-${{ inputs.kernelsu_branch }} ${KSU_MAIN_VERSION}.${KSU_SUB_VERSION}" >> $GITHUB_ENV
          echo "- SUSFS ${SUSFS_VERSION}" >> $GITHUB_ENV
          echo "- Manual Hooks" >> $GITHUB_ENV
          echo "- Wireguard Support" >> $GITHUB_ENV
          echo "**Notes:**" >> $GITHUB_ENV
          echo "This is a MODIFIED kernel only meant for VERMEER devices a.k.a Redmi K70 / Poco F6 Pro, running on HyperOS 1.0.6. If you do not have this device please do not flash this." >> $GITHUB_ENV
          echo "**Commit Hashes:**" >> $GITHUB_ENV
          echo "- KernelSU: [$KSU_REF]($KSU_URL)" >> $GITHUB_ENV
          echo "- SUSFS4KSU: [$COMMIT_HASH]($COMMIT_URL)" >> $GITHUB_ENV
          echo "LTO: thin" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Generate and create tag
        run: |
          TAGS=$(git tag -l "v${BASE_VERSION}-r*" | sort -V)
          if [ -z "$TAGS" ]; then
            NEW_TAG="v${BASE_VERSION}-r1"
          else
            LAST_TAG=$(echo "$TAGS" | tail -n1)
            LAST_NUM=$(echo "$LAST_TAG" | sed -E "s/v${BASE_VERSION//./\\.}-r([0-9]+)/\1/")
            NEW_NUM=$((LAST_NUM + 1))
            NEW_TAG="v${BASE_VERSION}-r${NEW_NUM}"
          fi
          while git rev-parse "$NEW_TAG" >/dev/null 2>&1; do
            NEW_TAG="${NEW_TAG}-$(date +%s)"
          done
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Prepare release assets
        run: |
          KSU_VERSION="${{ env.KSU_MAIN_VERSION }}"
          KSU_SUB_VERSION="${{ env.KSU_SUB_VERSION }}"
          SUSFS_VERSION="${{ env.SUSFS_VERSION }}"
          NEW_BASE_NAME="android13-5.15.123-AK3-KSU-Next-${KSU_VERSION}-Dev-${KSU_SUB_VERSION}-SUSFS${SUSFS_VERSION}"
          echo "Test content" > "${NEW_BASE_NAME}.zip"
          echo "Test content" > "${NEW_BASE_NAME}.img"

      - name: Create GitHub release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.NEW_TAG }}
          release_name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_NOTES }}
          prerelease: true

      - name: Upload release assets
        run: |
          gh release upload ${{ env.NEW_TAG }} "${NEW_BASE_NAME}.zip" "${NEW_BASE_NAME}.img"

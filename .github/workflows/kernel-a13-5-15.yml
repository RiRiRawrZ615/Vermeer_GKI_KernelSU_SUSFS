name: Android 13 5.15

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      make_release:
        required: true
        type: boolean
        default: true
      kernelsu_branch:
        required: true
        type: string
      kernelsu_branch_other:
        required: false
        type: string
        default: ""

jobs:
  build-kernel-a13-5-15:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "123"
            os_patch_level: "2023-11"
    uses: ./.github/workflows/build-a13-5-15.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      android_version: "android13"
      kernel_version: "5.15"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      kernelsu_variant: "Next"
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}

name: Android 13 5.15
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions

on:
  workflow_call:  # This allows this workflow to be called from another workflow
    inputs:
      make_release:
        required: true
        type: boolean
        default: true
      kernelsu_variant:
        required: true
        type: choice
        options:
          - Next
        default: Next
      kernelsu_branch:
        required: true
        type: choice
        options:
          - Stable
          - Dev
          - Other
        default: Dev
      kernelsu_branch_other:
        required: false
        type: string
      kernelsu_commit_hash:
        required: true
        type: string
        default: "3fd61e0ee5ee5e6fe941a892924ac26aa752b618"
      susfs_version:
        required: true
        type: string
        default: "v1.5.9"
  
jobs:
  build-kernel-a13-5-15-kernelsu-susfs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "123"
            os_patch_level: "2023-11"
            
    uses: ./.github/workflows/gki-kernel.yml
    secrets: inherit
    with:
      make_release: ${{ inputs.make_release }}
      android_version: "android13"
      kernel_version: "5.15"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      kernelsu_branch: ${{ inputs.kernelsu_branch }}
      kernelsu_branch_other: ${{ inputs.kernelsu_branch_other }}
      kernelsu_commit_hash: ${{ inputs.kernelsu_commit_hash }}
      susfs_version: ${{ inputs.susfs_version }}
